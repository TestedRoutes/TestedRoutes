# Dependency scanning (Tracker #238 / Website Build #113). Weekly, capped,
# so alerts arrive as a handful of reviewable PRs instead of a flood.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
