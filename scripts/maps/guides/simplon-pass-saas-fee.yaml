title: "Simplon Pass – Saas Fee"
output: "../output/Simplon Pass - Saas Fee/simplon-pass-saas-fee.png"

# Combined map uses both GPX files concatenated.
gpx:
  - "../output/Simplon Pass - Saas Fee/hiking-in-switzerland-6-18.gpx"
  - "../output/Simplon Pass - Saas Fee/hiking-in-switzerland-6-19.gpx"

# Stages 18 & 19 of the Alpenpässe-Weg. Coordinates taken from GPX
# endpoints (stage 18 last == stage 19 first, so Gspon is the junction).
waypoints:
  - {name: Simplon Pass,           lat: 46.246916, lon: 8.029034}
  - {name: Hotel Alpenblick Gspon, lat: 46.225179, lon: 7.902194}
  - {name: Saas Fee,               lat: 46.108813, lon: 7.929233}

# Per-stage profiles. make_profile.py renders one PNG per entry.
profiles:
  - title: "Stage 18: Simplon Pass – Hotel Alpenblick Gspon"
    gpx: "../output/Simplon Pass - Saas Fee/hiking-in-switzerland-6-18.gpx"
    output: "../output/Simplon Pass - Saas Fee/simplon-pass-saas-fee-stage1-profile.png"
  - title: "Stage 19: Hotel Alpenblick Gspon – Saas Fee"
    gpx: "../output/Simplon Pass - Saas Fee/hiking-in-switzerland-6-19.gpx"
    output: "../output/Simplon Pass - Saas Fee/simplon-pass-saas-fee-stage2-profile.png"
