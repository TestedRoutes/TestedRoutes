# Fiji place pool — PROTOTYPE SEED (2026-09-20).
#
# The real file is machine-owned: `npm run import:master` regenerates it
# wholesale from TestedRoutes_Fiji_Master_v<N>.xlsx, which lives on the
# founder's machine and cannot be read from a remote session. This seed
# exists so the gated-reader prototype has something to render before that
# import has run. Two consequences, both deliberate:
#
#   - pin_ids are provisional (FJ-P##, "P" for prototype) so they can never
#     collide with the workbook's numeric FJ-### ids. When the import runs,
#     sku.yaml's `place:` references must be remapped to the workbook ids in
#     the same commit — the publish script fails loudly on an unknown pin, so
#     a missed one cannot slip through.
#   - go_slug is left empty everywhere. Aliases are frozen printed contracts
#     and the import validates each against live Sanity; guessing one here
#     would put an unverified link in front of a buyer.
#
# Coordinates come from the sales-page data module (scripts/guides/
# fiji-honeymoon-14-days.mjs), which took them from master v9. Taveuni-side
# longitudes are stored past 180 on purpose: the reader's map fits bounds on
# a continuous plane, and the negative form would draw the route the long
# way round the world. Pins without coordinates in that module carry none —
# nothing here is written from memory.
#
# photo_ref names a file in destination/generated/web/ (the founder's curated
# set) and is set only where that photo unambiguously shows the pin; the
# per-place photo pass fills the rest. `attributes` carries the practical
# facts the reader shows on a place card (access, time_needed, cost_band,
# season, parking, road), only where the published text states them.
