title: "St. Moritz to Alp Flix"
output: "../output/St Moritz - Alp Flix/st-moritz-alp-flix.png"

# Combined map uses both GPX files concatenated.
gpx:
  - "../output/St Moritz - Alp Flix/hiking-in-switzerland-6-1.gpx"
  - "../output/St Moritz - Alp Flix/hiking-in-switzerland-6-2.gpx"

# Stages 1 & 2 of the Alpine Passes Trail. The official stage 1 STARTS at
# Corviglia (2,488 m): lifts up from town are part of the route, not a
# shortcut. 2026 note: the St. Moritz-Corviglia funicular is closed all
# summer (overhaul); access is the Signal cable car from St. Moritz Bad +
# shuttle. Pass coordinates extracted from GPX trackpoints (on-trail by
# construction); hut + village pins verified via Overpass/previous session.
waypoints:
  - {name: St. Moritz,        lat: 46.498200, lon: 9.839000}
  - {name: Corviglia,         lat: 46.508389, lon: 9.818686, arrive_by: cable car}
  - {name: Fuorcla Schlattain, lat: 46.511137, lon: 9.784705}
  - {name: Fuorcla Suvretta,  lat: 46.510441, lon: 9.755516}
  - {name: Jenatschhütte,     lat: 46.529561, lon: 9.724140}
  - {name: Fuorcla d'Agnel,   lat: 46.510327, lon: 9.714855}
  - {name: Fcla. digl Leget,  lat: 46.489799, lon: 9.694096}
  - {name: Alp Flix, Tigias,  lat: 46.521625, lon: 9.655481}

# Per-stage profiles. GPX is the source of truth for ascent/descent
# (founder rule, 2026-08-04): deck copy uses these footer numbers verbatim.
profiles:
  - title: "Day 1: Corviglia to the hut"
    gpx: "../output/St Moritz - Alp Flix/hiking-in-switzerland-6-1.gpx"
    output: "../output/St Moritz - Alp Flix/st-moritz-alp-flix-stage1-profile.png"
  - title: "Day 2: The hut to Alp Flix"
    gpx: "../output/St Moritz - Alp Flix/hiking-in-switzerland-6-2.gpx"
    output: "../output/St Moritz - Alp Flix/st-moritz-alp-flix-stage2-profile.png"
