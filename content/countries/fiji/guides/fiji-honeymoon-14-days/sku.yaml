# Fiji 14-day honeymoon — structured content, PROTOTYPE SEED (2026-09-20).
#
# The authoring truth for this file is the sellable deck; the one-time
# extraction (`scripts/extract_fiji_deck.py`) reads the deck-builder sources
# on the founder's machine and cannot run remotely. This seed is what the
# gated-reader prototype renders until that extraction lands, and it is
# built only from text already published by the founder: the Reader
# Directions canvas (Day 2 verbatim, the app screens for bookings, pack and
# stays), the Guide Content Architecture doc (Day 1 slots), and the
# sales-page data module. Nothing is written from memory.
#
# Honesty markers, so the prototype cannot be mistaken for the guide:
#   - Day 2 is complete. Day 1 carries the three slots and three callouts the
#     architecture doc quotes; its source truncated them mid-sentence, so
#     the remaining four moves are absent and the bodies end where the quote
#     ended. Every other day page is a title-only stub (the publisher warns
#     "N slots, deck convention is 7" for each — that warning is the point).
#   - The extraction replaces this file wholesale. Do not hand-extend the
#     stubs here; the deck is the source.
#   - `place:` references use the provisional FJ-P## pins from the seed
#     places.yaml — see its header for the remap rule.
slug: fiji-honeymoon-14-days
country: fj
sku_code: fiji-14d
structure_type: week_guide
duration_days: 14
sample_day: 2
status: draft
title: "Fiji: 14-Day Honeymoon"
subtitle: Which island for which couple – mainland vs resort.

days:
  - day_from: 1
    day_to: 1
    page_group: 1
    badge: DAY 1
    title: NADI ARRIVAL
    subtitle: Land, get to Denarau, and let the first day be soft.
    rail_start: 9
    rail_end: 23
    photo_caption: Denarau · the strip at dusk
    # EXTRACTION PENDING: 3 of 7 moves; bodies end where the source quote ended.
    slots:
      - time: "10:00"
        title: Land at NAN
        body: Allow up to an hour behind a widebody.
        place: FJ-P01
      - time: "11:30"
        title: Transfer to Denarau
        body: About 20 minutes. Agree the fare before you get in.
      - time: "22:00"
        title: Night · the Hilton
        body: A run of pools along the water.
        place: FJ-P02
    callouts:
      - kind: info
        title: NO BUDGET BED
        body: On Denarau, by design. Cheap means Nadi.
      - kind: info
        title: LANDED LATE?
        body: Nothing today is timed.
      - kind: warning
        title: NO METERS
        body:
          - Taxis have no meters anywhere in Fiji.
          - FJD 8 per person into Nadi town.

  - day_from: 2
    day_to: 2
    page_group: 2
    badge: DAY 2
    title: THE ISLAND DAY
    subtitle: Out to a Mamanuca island on your first full day, because it is what you came for.
    rail_start: 8
    rail_end: 18
    photo_caption: Port Denarau · the departure quay, 08:40
    slots:
      - time: "08:45"
        title: Port Denarau
        body: Check in 45 minutes before sailing. The quay is a 10 minute walk or a short taxi from any Denarau hotel.
        place: FJ-P03
      - time: "09:30"
        title: Catamaran out
        body: About 90 minutes across the Mamanuca cays.
      - time: "11:00"
        title: Castaway Island
        body: A resort island rather than a day-trip facility, and the day boat is capped at twenty passengers, so the beach never fills.
        place: FJ-P04
      - time: "12:30"
        title: Lunch, then the reef
        body: Snorkel gear, kayaks and paddleboards come with the ticket.
      - time: "14:30"
        title: The pools, or the sand
        body: Five hours ashore, and already the pale blue the Yasawas do.
      - time: "16:20"
        title: Leave the island
        body: Same boat, same route back.
      - time: "18:00"
        title: Back at Port Denarau
        body: "Dinner on the quay. Pack tonight: 15 kg goes north."
        place: FJ-P03
    callouts:
      - kind: warning
        title: 20 SEATS
        body:
          - Twenty passengers a day is the whole argument for Castaway, and it is also why this is not a turn-up-and-buy.
          - FJD 335 per adult. Book it before you fly.
      - kind: info
        title: DRINKS EXTRA
        body: Transfers, lunch and every piece of kit are in. The bar is a card.
      - kind: info
        title: ALL INCLUSIVE?
        body: Captain Cook's Kadavu Lailai sail includes drinks, but up to 200 ashore.

